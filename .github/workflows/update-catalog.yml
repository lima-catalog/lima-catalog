name: Update Lima Template Catalog

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_analyze:
        description: 'Force re-analysis of ALL templates (populates new metrics)'
        required: false
        type: boolean
        default: false
      force_full_discovery:
        description: 'Force FULL re-discovery of ALL templates (fixes missing templates)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.24'

      - name: Build catalog tool
        run: go build -o lima-catalog ./cmd/lima-catalog

      - name: Checkout data branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: data
          path: data-branch

      - name: Clone lima-vm/lima repository
        run: |
          # Clone full history for historic knowledge tracking (git log traversal)
          git clone https://github.com/lima-vm/lima.git lima-repo
          echo "Cloned lima-vm/lima for official knowledge tracking"

      - name: Run catalog collection
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          DATA_DIR: ./catalog-data
          INCREMENTAL: ${{ inputs.force_full_discovery == true && '' || 'true' }}
          ANALYZE: "true"
          FORCE_ANALYZE: ${{ inputs.force_analyze == true && 'true' || '' }}
          FORCE_FULL_DISCOVERY: ${{ inputs.force_full_discovery == true && 'true' || '' }}
          LIMA_REPO_PATH: ./lima-repo
          LIMA_TEMPLATES_PATH: ./lima-repo/templates
        run: |
          # Copy existing data from data branch to enable incremental updates
          mkdir -p catalog-data
          cp -r data-branch/data/* catalog-data/ 2>/dev/null || true

          # Run catalog tool in incremental mode and capture output
          ./lima-catalog 2>&1 | tee lima-catalog-output.txt

      - name: Upload tool output as artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: lima-catalog-output
          path: lima-catalog-output.txt
          retention-days: 30
        # Uploads console output from lima-catalog tool for easier local analysis

      - name: Copy data to data branch
        run: |
          cp -r catalog-data/* data-branch/data/

      - name: Commit and push data
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all changes (both new and modified files)
          git add data/

          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git commit -m "Update Lima template catalog - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push origin data

      - name: Create summary
        run: |
          echo "## Catalog Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f catalog-data/progress.json ]; then
            echo "**Statistics:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat catalog-data/progress.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
