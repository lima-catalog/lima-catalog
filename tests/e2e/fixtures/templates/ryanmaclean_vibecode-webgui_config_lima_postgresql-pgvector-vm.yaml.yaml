# Lima template: Postgresql Pgvector VM
# Https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img-based development (aarch64). Sample vibecoding platform based on code-server mixed with OpenRouter, monitored via Datadog/OpenTelemetry/Vector. Uses optional PostgreSQL pgvector for RAG implementation.
# Category: development
# Official: false
# Source: github:ryanmaclean/vibecode-webgui/config/lima/postgresql-pgvector-vm

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:example-digest-for-testing"

cpus: 4
memory: "4GiB"
disk: "100GiB"

mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: true



# Keywords: ubuntu, containerd, git, postgres

# Notability Score: 204.5
