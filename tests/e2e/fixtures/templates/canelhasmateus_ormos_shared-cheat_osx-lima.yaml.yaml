# Lima template: OSX Lima
# Https://cloud-images.ubuntu.com/releases/22.10/release-20230413/ubuntu-22.10-server-cloudimg-amd64.img-based general (x86_64). A collection of dotfiles and environment automation scripts.
# Category: general
# Official: false
# Source: github:canelhasmateus/ormos/shared-cheat/osx-lima

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:example-digest-for-testing"

cpus: 4
memory: "4GiB"
disk: "100GiB"

mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: true



